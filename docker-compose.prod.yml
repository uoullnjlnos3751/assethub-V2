services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: assethub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for production}
      POSTGRES_DB: assethub
    # Production: ไม่เปิด port ออกภายนอก — backend เข้าถึงผ่าน internal network
    # ports:
    #   - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assethub"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql://assethub:${POSTGRES_PASSWORD}@postgres:5432/assethub?schema=public"
      NODE_ENV: production
      FRONTEND_URL: "${FRONTEND_URL:?FRONTEND_URL must be set for production}"
      CORS_ORIGIN: "${CORS_ORIGIN:?CORS_ORIGIN must be set for production}"
      # Optional: hostnames allowed on any scheme/port (was hardcoded in app.ts)
      CORS_ALLOWED_HOSTNAMES: "${CORS_ALLOWED_HOSTNAMES:-}"
    volumes:
      - uploads_data:/app/uploads
      - backups_data:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2048M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  pgdata:
  uploads_data:
  backups_data:
