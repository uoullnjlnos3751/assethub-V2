# Regenerated by deploy.ps1 on every blue/green swap — do not hand-edit the
# hostnames below, they get overwritten. `map` (unlike `upstream {}`) does no
# DNS resolution itself; it just assigns the string, so this file loading
# never fails even if the target container doesn't exist yet. See nginx.conf
# for why that matters.
map $host $backend_upstream {
    default "assethub-blue-backend-1:4000";
}

map $host $frontend_upstream {
    default "assethub-blue-frontend-1:80";
}
