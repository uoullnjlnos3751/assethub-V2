# Nginx Main Configuration
#
# $backend_upstream/$frontend_upstream are defined by upstream.conf (via
# `map`, not a `set` here) — deploy.ps1 regenerates that file on every
# blue/green swap with the new color's container names, then does
# `nginx -s reload`. Do NOT redefine them with `set` in this file: `set`
# runs per-request inside the server block and would silently win over
# whatever upstream.conf says, breaking the color swap.
#
# Why `map` (in upstream.conf) instead of the `upstream {}` blocks this
# used to be (see git history): `upstream {}` resolves DNS once at nginx
# startup/reload. This container has no depends_on/startup-order
# coordination with backend/frontend (separate compose files/projects —
# docker-compose.shared.yml vs .app.yml), so if nginx starts before those
# containers exist, resolution fails and nginx treats it as a fatal config
# error: it exits immediately and keeps crash-looping forever under
# `restart: always`, never self-healing even once the app containers come
# up — port 80 never binds until someone notices and restarts nginx by
# hand. `resolver` + a variable in proxy_pass (fed by `map`, which does no
# DNS itself) defers the lookup to request time instead of config-load
# time, so a missing upstream just 502s that one request — nginx itself
# stays up and keeps retrying every `valid` interval.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name localhost;

    # Default is 1m — well below multer's 10MB limit on PM/asset photo
    # uploads (backend/src/routes/pm.ts), which was rejecting uploads here
    # before they ever reached the backend.
    client_max_body_size 10m;

    # Backend API Proxy
    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/ai/chat streams Server-Sent Events — buffering here would
        # collect the whole response before forwarding it, silently turning
        # the stream back into one long wait on the client.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # Frontend Proxy (and everything else)
    location / {
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Vite (if needed in dev, though this is production build)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
