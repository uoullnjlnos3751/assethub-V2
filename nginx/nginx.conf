# Nginx Main Configuration
server {
    listen 80;
    server_name localhost;

    # Default is 1m — well below multer's 10MB limit on PM/asset photo
    # uploads (backend/src/routes/pm.ts), which was rejecting uploads here
    # before they ever reached the backend.
    client_max_body_size 10m;

    # Backend API Proxy
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/ai/chat streams Server-Sent Events — buffering here would
        # collect the whole response before forwarding it, silently turning
        # the stream back into one long wait on the client.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # Frontend Proxy (and everything else)
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support for Vite (if needed in dev, though this is production build)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
