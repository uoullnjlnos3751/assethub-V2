<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>TRR Asset Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ============================================================
   DESIGN TOKENS — แก้สีทั้งระบบได้ที่นี่ที่เดียว
   ============================================================ */
:root{
  --ground:#f4f6f8;
  --surface:#ffffff;
  --surface-2:#eaeef2;
  --surface-3:#f7f9fb;
  --line:#dbe2e9;
  --line-soft:#e8edf2;
  --ink:#152029;
  --ink-2:#5b6b7a;
  --ink-3:#8496a6;

  --brand:#0d3b47;          /* แถบเมนูซ้าย */
  --brand-hi:#12505f;
  --brand-ink:#cfe4e9;
  --brand-ink-hi:#ffffff;

  --accent:#0b6e80;         /* ปุ่มหลัก / ลิงก์ / active */
  --accent-hi:#095a69;
  --accent-tint:#e0f0f3;
  --accent-ink:#ffffff;

  /* Status — ตรวจผ่าน CVD validator แล้ว */
  --st-good:#0ca30c;
  --st-info:#2a78d6;
  --st-warn:#d98407;
  --st-crit:#d03b3b;
  --st-mute:#8a8f96;
  --st-good-bg:#e4f6e4; --st-good-tx:#0a6b12;
  --st-info-bg:#e4eefb; --st-info-tx:#1b5aa6;
  --st-warn-bg:#fbeedb; --st-warn-tx:#8a5406;
  --st-crit-bg:#fae5e5; --st-crit-tx:#9c2626;
  --st-mute-bg:#eceff2; --st-mute-tx:#5b6b7a;

  --shadow-sm:0 1px 2px rgba(21,32,41,.06);
  --shadow:0 2px 4px rgba(21,32,41,.05), 0 12px 28px -14px rgba(21,32,41,.22);
  --shadow-lg:0 8px 40px -12px rgba(21,32,41,.30);

  --r-sm:6px; --r:9px; --r-lg:12px;
  --rail:240px; --rail-min:64px; --topbar:56px;

  --f-display:'Anuphan','IBM Plex Sans Thai',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Thai',system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0d141a;
    --surface:#141d25;
    --surface-2:#1b2630;
    --surface-3:#111a21;
    --line:#28353f;
    --line-soft:#1f2b34;
    --ink:#e6eef5;
    --ink-2:#93a5b5;
    --ink-3:#6d8091;

    --brand:#0a2c36;
    --brand-hi:#124453;
    --brand-ink:#9dc0c9;
    --brand-ink-hi:#ffffff;

    --accent:#3fb3c9;
    --accent-hi:#5cc6da;
    --accent-tint:#10333c;
    --accent-ink:#04222a;

    --st-good:#16b516;
    --st-info:#3987e5;
    --st-warn:#e5a020;
    --st-crit:#e05c5c;
    --st-mute:#8f9dad;
    --st-good-bg:#0f2c16; --st-good-tx:#5fd45f;
    --st-info-bg:#12263d; --st-info-tx:#79b4f2;
    --st-warn-bg:#33260f; --st-warn-tx:#e9b45a;
    --st-crit-bg:#361a1a; --st-crit-tx:#f08a8a;
    --st-mute-bg:#1d262e; --st-mute-tx:#93a5b5;

    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 2px 4px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.7);
    --shadow-lg:0 8px 40px -12px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  --ground:#0d141a;
  --surface:#141d25;
  --surface-2:#1b2630;
  --surface-3:#111a21;
  --line:#28353f;
  --line-soft:#1f2b34;
  --ink:#e6eef5;
  --ink-2:#93a5b5;
  --ink-3:#6d8091;

  --brand:#0a2c36;
  --brand-hi:#124453;
  --brand-ink:#9dc0c9;
  --brand-ink-hi:#ffffff;

  --accent:#3fb3c9;
  --accent-hi:#5cc6da;
  --accent-tint:#10333c;
  --accent-ink:#04222a;

  --st-good:#16b516;
  --st-info:#3987e5;
  --st-warn:#e5a020;
  --st-crit:#e05c5c;
  --st-mute:#8f9dad;
  --st-good-bg:#0f2c16; --st-good-tx:#5fd45f;
  --st-info-bg:#12263d; --st-info-tx:#79b4f2;
  --st-warn-bg:#33260f; --st-warn-tx:#e9b45a;
  --st-crit-bg:#361a1a; --st-crit-tx:#f08a8a;
  --st-mute-bg:#1d262e; --st-mute-tx:#93a5b5;

  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 2px 4px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.7);
  --shadow-lg:0 8px 40px -12px rgba(0,0,0,.75);
}

/* ============================================================ RESET */
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button,input,select{font:inherit;color:inherit;}
button{background:none;border:none;cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
.mono{font-family:var(--f-mono);font-size:.86em;letter-spacing:-.01em;}
.num{font-variant-numeric:tabular-nums;}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}

/* ============================================================ SHELL */
.app{display:flex;height:100vh;overflow:hidden;}

/* --- Sidebar --- */
.rail{
  width:var(--rail);flex:none;background:var(--brand);color:var(--brand-ink);
  display:flex;flex-direction:column;transition:width .18s ease;z-index:40;
}
.app.collapsed .rail{width:var(--rail-min);}
.rail-top{
  height:var(--topbar);display:flex;align-items:center;gap:10px;
  padding:0 14px;border-bottom:1px solid rgba(255,255,255,.09);flex:none;
}
.logo{
  width:32px;height:32px;flex:none;border-radius:var(--r-sm);
  background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-family:var(--f-display);
  font-weight:700;font-size:13px;letter-spacing:-.02em;
}
.logo-tx{display:flex;flex-direction:column;line-height:1.15;overflow:hidden;}
.logo-tx b{font-family:var(--f-display);font-size:13.5px;font-weight:600;color:var(--brand-ink-hi);white-space:nowrap;}
.logo-tx span{font-size:10px;color:var(--brand-ink);opacity:.7;white-space:nowrap;letter-spacing:.04em;}
.app.collapsed .logo-tx{display:none;}

.rail-nav{flex:1;overflow-y:auto;padding:10px 8px;display:flex;flex-direction:column;gap:1px;}
.rail-sec{
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--brand-ink);opacity:.5;padding:14px 10px 5px;white-space:nowrap;
}
.app.collapsed .rail-sec{opacity:0;height:14px;padding:6px 0 0;overflow:hidden;}
.nav-i{
  display:flex;align-items:center;gap:11px;width:100%;
  padding:9px 10px;border-radius:var(--r-sm);
  color:var(--brand-ink);font-size:13.5px;text-align:left;
  transition:background .12s,color .12s;position:relative;
}
.nav-i svg{width:19px;height:19px;flex:none;}
.nav-i span{white-space:nowrap;overflow:hidden;}
.app.collapsed .nav-i span{display:none;}
.app.collapsed .nav-i{justify-content:center;padding:9px 0;}
.nav-i:hover{background:var(--brand-hi);color:var(--brand-ink-hi);}
.nav-i.on{background:var(--brand-hi);color:var(--brand-ink-hi);font-weight:500;}
.nav-i.on::before{
  content:"";position:absolute;left:-8px;top:50%;transform:translateY(-50%);
  width:3px;height:20px;border-radius:0 3px 3px 0;background:var(--accent);
}
.nav-badge{
  margin-left:auto;background:var(--st-crit);color:#fff;font-size:10px;
  font-weight:600;padding:1px 6px;border-radius:99px;line-height:1.5;
}
.app.collapsed .nav-badge{display:none;}
.rail-foot{padding:8px;border-top:1px solid rgba(255,255,255,.09);flex:none;}

/* --- Main --- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;}
.topbar{
  height:var(--topbar);flex:none;background:var(--surface);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:0 16px;
}
.icon-btn{
  width:34px;height:34px;flex:none;border-radius:var(--r-sm);
  display:grid;place-items:center;color:var(--ink-2);
  transition:background .12s,color .12s;
}
.icon-btn svg{width:18px;height:18px;}
.icon-btn:hover{background:var(--surface-2);color:var(--ink);}
.icon-btn.on{background:var(--accent-tint);color:var(--accent);}
.page-title{font-family:var(--f-display);font-size:16px;font-weight:600;white-space:nowrap;}

.search{
  flex:1;max-width:520px;position:relative;display:flex;align-items:center;
}
.search svg{position:absolute;left:11px;width:16px;height:16px;color:var(--ink-3);pointer-events:none;}
.search input{
  width:100%;height:36px;padding:0 12px 0 34px;
  background:var(--surface-2);border:1px solid transparent;
  border-radius:var(--r);font-size:13.5px;
  transition:border-color .12s,background .12s;
}
.search input::placeholder{color:var(--ink-3);}
.search input:focus{outline:none;background:var(--surface);border-color:var(--accent);}
.spacer{flex:1;}

.btn{
  display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;
  border-radius:var(--r-sm);font-size:13px;font-weight:500;
  transition:background .12s,border-color .12s;white-space:nowrap;
}
.btn svg{width:15px;height:15px;}
.btn-primary{background:var(--accent);color:var(--accent-ink);}
.btn-primary:hover{background:var(--accent-hi);}
.btn-ghost{border:1px solid var(--line);color:var(--ink-2);}
.btn-ghost:hover{background:var(--surface-2);color:var(--ink);}
.avatar{
  width:32px;height:32px;border-radius:50%;background:var(--accent);
  color:var(--accent-ink);display:grid;place-items:center;
  font-size:12px;font-weight:600;flex:none;
}

/* --- Sub tabs --- */
.subtabs{
  flex:none;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;gap:2px;padding:0 12px;overflow-x:auto;scrollbar-width:none;
}
.subtabs::-webkit-scrollbar{display:none;}
.subtab{
  display:flex;align-items:center;gap:7px;
  padding:11px 14px 9px;font-size:13.5px;color:var(--ink-2);
  border-bottom:2px solid transparent;white-space:nowrap;transition:color .12s;
}
.subtab svg{width:16px;height:16px;flex:none;opacity:.75;}
.subtab.on svg{opacity:1;}
.subtab:hover{color:var(--ink);}
.subtab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:500;}

/* --- Content --- */
.content{flex:1;overflow:auto;padding:16px;position:relative;}
.content.flush{padding:0;display:flex;flex-direction:column;overflow:hidden;}

/* --- Explorer toolbar --- */
.toolbar{
  flex:none;display:flex;align-items:center;gap:4px;
  padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line);
  flex-wrap:wrap;
}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;
  border-radius:99px;border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);
  transition:background .12s,border-color .12s,color .12s;
}
.chip svg{width:14px;height:14px;}
.chip:hover{background:var(--surface-2);color:var(--ink);}
.chip.on{background:var(--accent-tint);border-color:transparent;color:var(--accent);font-weight:500;}
.tb-div{width:1px;height:20px;background:var(--line);margin:0 5px;flex:none;}

/* --- Table --- */
.tbl-scroll{flex:1;overflow:auto;background:var(--surface);}
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:1100px;}
table.grid thead th{
  position:sticky;top:0;z-index:5;background:var(--surface-3);
  text-align:left;font-size:11px;font-weight:600;letter-spacing:.03em;
  text-transform:uppercase;color:var(--ink-2);
  padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
}
table.grid thead th.sortable{cursor:pointer;user-select:none;}
table.grid thead th.sortable:hover{color:var(--accent);}
.sort-ind{display:inline-block;margin-left:4px;opacity:.35;font-size:9px;}
.sort-ind.on{opacity:1;color:var(--accent);}
tr.filters th{
  position:sticky;top:33px;z-index:4;background:var(--surface);
  padding:6px 8px;border-bottom:1px solid var(--line);
}
tr.filters input{
  width:100%;min-width:70px;height:28px;padding:0 8px;font-size:12px;
  background:var(--surface-2);border:1px solid transparent;border-radius:var(--r-sm);
}
tr.filters input:focus{outline:none;background:var(--surface);border-color:var(--accent);}
table.grid tbody td{
  padding:9px 12px;border-bottom:1px solid var(--line-soft);
  font-size:13px;vertical-align:middle;white-space:nowrap;
}
table.grid tbody tr{transition:background .1s;cursor:pointer;}
table.grid tbody tr:hover{background:var(--surface-3);}
table.grid tbody tr.sel{background:var(--accent-tint);}
td.cell-link{color:var(--accent);font-weight:500;}
/* คอลัมน์ปุ่ม ⋮ ตรึงไว้ขอบขวาเสมอ แม้ตารางจะเลื่อนแนวนอน */
table.grid thead th:last-child{position:sticky;right:0;z-index:6;background:var(--surface-3);border-left:1px solid var(--line);}
tr.filters th:last-child{position:sticky;right:0;z-index:5;background:var(--surface);border-left:1px solid var(--line);}
table.grid tbody td:last-child{position:sticky;right:0;background:var(--surface);border-left:1px solid var(--line-soft);}
table.grid tbody tr:hover td:last-child{background:var(--surface-3);}
table.grid tbody tr.sel td:last-child{background:var(--accent-tint);}
.chk{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;vertical-align:middle;}
.col-chk{width:38px;}

.pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:2px 9px 2px 7px;border-radius:99px;font-size:11.5px;font-weight:500;
}
.pill .dot{width:6px;height:6px;border-radius:50%;flex:none;}
.pill.good{background:var(--st-good-bg);color:var(--st-good-tx);}
.pill.good .dot{background:var(--st-good);}
.pill.info{background:var(--st-info-bg);color:var(--st-info-tx);}
.pill.info .dot{background:var(--st-info);}
.pill.warn{background:var(--st-warn-bg);color:var(--st-warn-tx);}
.pill.warn .dot{background:var(--st-warn);}
.pill.crit{background:var(--st-crit-bg);color:var(--st-crit-tx);}
.pill.crit .dot{background:var(--st-crit);}
.pill.mute{background:var(--st-mute-bg);color:var(--st-mute-tx);}
.pill.mute .dot{background:var(--st-mute);}

.path{color:var(--ink-2);font-size:12.5px;}
.path i{color:var(--ink-3);font-style:normal;margin:0 4px;}
.person{display:flex;align-items:center;gap:7px;}
.person .ini{
  width:22px;height:22px;border-radius:50%;flex:none;
  background:var(--surface-2);color:var(--ink-2);
  display:grid;place-items:center;font-size:10px;font-weight:600;
}
.tag{
  display:inline-block;padding:1px 8px;border-radius:var(--r-sm);
  background:var(--surface-2);color:var(--ink-2);font-size:11.5px;
}

/* --- Cards view --- */
.cards{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));
  gap:12px;padding:14px;
}
.acard{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:14px;box-shadow:var(--shadow-sm);cursor:pointer;transition:box-shadow .14s,border-color .14s;
}
.acard:hover{box-shadow:var(--shadow);border-color:var(--accent);}
.acard-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px;}
.acard-h b{font-family:var(--f-display);font-size:14.5px;font-weight:600;}
.acard-code{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);display:block;margin-top:1px;}
.acard-rows{display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--line-soft);padding-top:10px;}
.acard-r{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;}
.acard-r span{color:var(--ink-3);flex:none;}
.acard-r b{font-weight:500;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* --- Footer / pagination --- */
.tbl-foot{
  flex:none;display:flex;align-items:center;gap:12px;
  padding:9px 14px;background:var(--surface);border-top:1px solid var(--line);
  font-size:12.5px;color:var(--ink-2);flex-wrap:wrap;
}
.count b{color:var(--accent);font-weight:600;font-family:var(--f-mono);}
.pager{display:flex;align-items:center;gap:3px;}
.pg{
  min-width:28px;height:28px;padding:0 7px;border-radius:var(--r-sm);
  font-size:12.5px;color:var(--ink-2);display:grid;place-items:center;
  font-variant-numeric:tabular-nums;
}
.pg:hover:not(:disabled){background:var(--surface-2);color:var(--ink);}
.pg.on{background:var(--accent);color:var(--accent-ink);font-weight:600;}
.pg:disabled{opacity:.3;cursor:default;}

/* --- Bulk bar --- */
.bulk{
  position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--ground);border-radius:99px;
  padding:8px 10px 8px 18px;display:flex;align-items:center;gap:12px;
  box-shadow:var(--shadow-lg);z-index:30;font-size:13px;white-space:nowrap;
}
.bulk button{color:var(--ground);opacity:.8;display:flex;align-items:center;gap:5px;font-size:12.5px;}
.bulk button:hover{opacity:1;}
.bulk button svg{width:14px;height:14px;}

/* ============================================================ DASHBOARD */
.dash{display:flex;flex-direction:column;gap:14px;max-width:1400px;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;}
.stat{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:14px 16px;box-shadow:var(--shadow-sm);
  display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden;
}
.stat::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);}
.stat.s-warn::after{background:var(--st-warn);}
.stat.s-crit::after{background:var(--st-crit);}
.stat.s-good::after{background:var(--st-good);}
.stat-l{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px;}
.stat-l svg{width:15px;height:15px;color:var(--ink-3);}
.stat-v{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.2;letter-spacing:-.02em;}
.stat-s{font-size:11.5px;color:var(--ink-3);}
.delta{font-size:11.5px;font-weight:600;}
.delta.up{color:var(--st-good-tx);}
.delta.down{color:var(--st-crit-tx);}

.panels{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:14px;}
@media (max-width:1000px){.panels{grid-template-columns:1fr;}}
.panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-sm);display:flex;flex-direction:column;overflow:hidden;
}
.panel-h{
  padding:13px 16px;border-bottom:1px solid var(--line-soft);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.panel-h h3{margin:0;font-family:var(--f-display);font-size:14px;font-weight:600;}
.panel-h p{margin:1px 0 0;font-size:11.5px;color:var(--ink-3);}
.panel-b{padding:16px;flex:1;}

/* Donut */
.donut-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;}
.donut{position:relative;width:170px;height:170px;flex:none;}
.donut svg{transform:rotate(-90deg);display:block;}
.donut-c{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;pointer-events:none;
}
.donut-c b{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1;letter-spacing:-.02em;}
.donut-c span{font-size:11px;color:var(--ink-3);margin-top:3px;}
.donut path{transition:opacity .12s;}
.donut path:hover{opacity:.75;cursor:pointer;}
.legend{width:100%;display:flex;flex-direction:column;gap:1px;}
.lg-row{
  display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:var(--r-sm);
  font-size:12.5px;transition:background .1s;cursor:pointer;
}
.lg-row:hover{background:var(--surface-3);}
.lg-row .sw{width:10px;height:10px;border-radius:3px;flex:none;}
.lg-row .nm{flex:1;color:var(--ink-2);}
.lg-row .vl{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500;}
.lg-row .pc{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);width:42px;text-align:right;font-variant-numeric:tabular-nums;}

/* Bars */
.bars{display:flex;flex-direction:column;gap:11px;}
.bar-row{display:grid;grid-template-columns:132px minmax(0,1fr) 46px;align-items:center;gap:11px;}
.bar-lb{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-tr{display:block;height:9px;background:var(--surface-2);border-radius:99px;overflow:hidden;}
.bar-fl{display:block;height:9px;min-width:4px;background:var(--accent);border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1);}
.bar-vl{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;text-align:right;font-weight:500;}

/* Alert list */
.alerts{display:flex;flex-direction:column;}
.alert{
  display:flex;align-items:flex-start;gap:11px;padding:11px 16px;
  border-bottom:1px solid var(--line-soft);cursor:pointer;transition:background .1s;
}
.alert:last-child{border-bottom:none;}
.alert:hover{background:var(--surface-3);}
.alert-ic{width:28px;height:28px;border-radius:var(--r-sm);display:grid;place-items:center;flex:none;}
.alert-ic svg{width:15px;height:15px;}
.alert-ic.warn{background:var(--st-warn-bg);color:var(--st-warn-tx);}
.alert-ic.crit{background:var(--st-crit-bg);color:var(--st-crit-tx);}
.alert-ic.info{background:var(--st-info-bg);color:var(--st-info-tx);}
.alert-b{flex:1;min-width:0;}
.alert-b b{display:block;font-size:13px;font-weight:500;}
.alert-b span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px;}
.alert-n{font-family:var(--f-mono);font-size:15px;font-weight:500;color:var(--ink-2);flex:none;}

/* ============================================================ DRAWER */
.scrim{
  position:fixed;inset:0;background:rgba(10,20,26,.42);z-index:50;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.scrim.on{opacity:1;pointer-events:auto;}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(440px,92vw);z-index:60;
  background:var(--surface);border-left:1px solid var(--line);
  box-shadow:var(--shadow-lg);transform:translateX(100%);
  transition:transform .22s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
}
.drawer.on{transform:translateX(0);}
.dw-h{padding:16px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px;}
.dw-h h2{margin:0;font-family:var(--f-display);font-size:17px;font-weight:600;}
.dw-h .mono{display:block;color:var(--ink-3);margin-top:2px;}
.dw-tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);flex:none;}
.dw-b{flex:1;overflow-y:auto;padding:16px;}
.dl{display:flex;flex-direction:column;gap:0;}
.dl-r{display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:13px;}
.dl-r dt{color:var(--ink-3);font-size:12.5px;}
.dl-r dd{margin:0;font-weight:500;overflow-wrap:anywhere;}
.dw-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex:none;}

/* ============================================================ SIDE PANEL (สรุปสถิติของผลลัพธ์ที่กรองอยู่) */
.withside{display:flex;flex:1;min-height:0;}
.withside > .tbl-scroll{flex:1;min-width:0;}
.side{
  width:290px;flex:none;border-left:1px solid var(--line);
  background:var(--surface);overflow-y:auto;padding:18px 16px;
  display:flex;flex-direction:column;gap:18px;
}
.side-stat{text-align:center;padding-bottom:16px;border-bottom:1px solid var(--line-soft);}
.side-stat span{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px;}
.side-stat b{
  display:block;font-family:var(--f-display);font-weight:700;
  font-size:30px;line-height:1.15;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
}
.side-stat b.money{font-size:23px;}
.side-sel{
  width:100%;height:34px;padding:0 10px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface-2);font-size:13px;
}
.side-sel:focus{outline:none;border-color:var(--accent);}
.side h4{
  margin:0;font-family:var(--f-display);font-size:12px;font-weight:600;
  text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);
}
@media (max-width:1100px){.side{display:none;}}

/* ============================================================ OPTIONS MENU */
.menu{
  position:absolute;right:12px;top:6px;z-index:35;min-width:280px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-lg);padding:6px;
}
/* เมนูคำสั่งรายแถว — ลอยตามตำแหน่งที่กด */
.rmenu{
  position:fixed;z-index:80;min-width:212px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-lg);padding:5px;
}
.rmenu button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:8px 10px;border-radius:var(--r-sm);font-size:13px;transition:background .1s;
}
.rmenu button:hover{background:var(--surface-3);}
.rmenu button svg{width:16px;height:16px;color:var(--ink-3);flex:none;}
.rmenu hr{border:none;border-top:1px solid var(--line-soft);margin:5px 6px;}
.rmenu .danger{color:var(--st-crit-tx);}
.rmenu .danger svg{color:var(--st-crit-tx);}
.menu-i{
  display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;
  border-radius:var(--r-sm);text-align:left;transition:background .1s;
}
.menu-i:hover{background:var(--surface-3);}
.menu-i > svg{width:17px;height:17px;color:var(--ink-3);flex:none;}
.menu-i .mi-b{flex:1;min-width:0;}
.menu-i b{display:block;font-size:13px;font-weight:500;}
.menu-i span{display:block;font-size:11.5px;color:var(--ink-3);}
.menu-i .mi-v{
  font-size:12px;color:var(--accent);background:var(--accent-tint);
  padding:2px 9px;border-radius:99px;font-weight:600;flex:none;
}
.menu select{
  height:28px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:var(--surface-2);font-size:12px;padding:0 6px;flex:none;
}

/* ============================================================ DETAIL PAGE */
.dt-head{
  background:var(--surface);border-bottom:1px solid var(--line);
  padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;flex:none;
}
.dt-ic{
  width:52px;height:52px;border-radius:var(--r-lg);flex:none;
  background:var(--accent-tint);color:var(--accent);display:grid;place-items:center;
}
.dt-ic svg{width:26px;height:26px;}
.dt-id{min-width:0;flex:1;}
.dt-id h2{margin:0;font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:-.01em;}
.dt-id p{margin:1px 0 0;font-size:12.5px;color:var(--ink-2);}
.dt-id .upd{font-size:11.5px;color:var(--ink-3);}
.dt-quick{display:flex;gap:10px;flex-wrap:wrap;}
.qcard{
  display:flex;align-items:center;gap:10px;min-width:172px;
  border:1px solid var(--line);border-radius:var(--r);padding:8px 11px;
  background:var(--surface-3);transition:border-color .12s;
}
.qcard:hover{border-color:var(--accent);}
.qcard > svg{width:18px;height:18px;color:var(--accent);flex:none;}
.qcard > svg:last-child{width:14px;height:14px;color:var(--ink-3);}
.qcard-b{flex:1;min-width:0;}
.qcard-b b{display:block;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.qcard-b span{display:block;font-size:11px;color:var(--ink-3);white-space:nowrap;}

.dt-body{flex:1;overflow-y:auto;padding:16px 18px 40px;}
.dt-alerts{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));
  gap:11px;margin-bottom:16px;
}
.hcard{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  border-left:3px solid var(--st-mute);padding:11px 13px;
  display:flex;align-items:center;gap:11px;box-shadow:var(--shadow-sm);
}
.hcard.ok{border-left-color:var(--st-good);}
.hcard.warn{border-left-color:var(--st-warn);}
.hcard.crit{border-left-color:var(--st-crit);}
.hcard-b{flex:1;min-width:0;}
.hcard-b b{display:block;font-size:13px;font-weight:600;}
.hcard.ok b{color:var(--st-good-tx);}
.hcard.warn b{color:var(--st-warn-tx);}
.hcard.crit b{color:var(--st-crit-tx);}
.hcard-b span{display:block;font-size:11.5px;color:var(--ink-3);}
.hcard > svg{width:20px;height:20px;flex:none;color:var(--ink-3);}

.dt-grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px;align-items:start;}
@media (max-width:1000px){.dt-grid{grid-template-columns:1fr;}}
.dt-col{display:flex;flex-direction:column;gap:14px;min-width:0;}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:0;}
.fld{padding:11px 14px;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);min-width:0;}
.fld dt{font-size:11.5px;color:var(--ink-3);margin-bottom:2px;}
.fld dd{margin:0;font-size:13.5px;font-weight:500;overflow-wrap:anywhere;}
.fld dd.na{color:var(--ink-3);font-weight:400;font-style:italic;}

.tl{display:flex;flex-direction:column;}
.tl-i{display:flex;gap:11px;padding:10px 16px;border-bottom:1px solid var(--line-soft);}
.tl-i:last-child{border-bottom:none;}
.tl-d{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2);}
.tl-d svg{width:14px;height:14px;}
.tl-b b{display:block;font-size:13px;font-weight:500;}
.tl-b span{display:block;font-size:11.5px;color:var(--ink-3);}
.chips{display:flex;flex-wrap:wrap;gap:7px;padding:14px 16px;}
.chip-tag{
  display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;
  background:var(--surface-2);font-size:12px;color:var(--ink-2);
}
.chip-tag i{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;}

/* ============================================================ SETTINGS PAGE */
.setwrap{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(390px,1fr));
  gap:14px;align-items:start;max-width:1500px;
}
.setsec{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-sm);overflow:hidden;
}
.setsec-h{
  display:flex;align-items:center;gap:10px;padding:13px 16px;
  border-bottom:1px solid var(--line-soft);background:var(--surface-3);
}
.setsec-h > svg{width:19px;height:19px;color:var(--accent);flex:none;}
.setsec-h h3{margin:0;font-family:var(--f-display);font-size:14.5px;font-weight:600;}
.setsec-n{margin-left:auto;font-size:11.5px;color:var(--ink-3);flex:none;}
.setsec-b{display:flex;flex-direction:column;}
.setitem{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:11px 16px;border-bottom:1px solid var(--line-soft);transition:background .1s;
}
.setitem:last-child{border-bottom:none;}
.setitem:hover{background:var(--surface-3);}
.setitem-ic{
  width:30px;height:30px;border-radius:var(--r-sm);flex:none;
  background:var(--accent-tint);color:var(--accent);display:grid;place-items:center;
}
.setitem-ic svg{width:16px;height:16px;}
.setitem-b{flex:1;min-width:0;}
.setitem-b b{display:block;font-size:13.5px;font-weight:500;}
.setitem-b > span{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.45;}
.setitem > svg:last-child{width:15px;height:15px;color:var(--ink-3);flex:none;}

/* ============================================================ MISC */
.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:70px 20px;color:var(--ink-3);text-align:center;
}
.empty svg{width:42px;height:42px;opacity:.4;}
.empty b{font-family:var(--f-display);font-size:15px;font-weight:600;color:var(--ink-2);}
.empty p{margin:0;font-size:13px;max-width:340px;}

.toasts{position:fixed;bottom:18px;right:18px;z-index:90;display:flex;flex-direction:column;gap:8px;}
.toast{
  background:var(--ink);color:var(--ground);padding:11px 15px;border-radius:var(--r);
  font-size:13px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:9px;
  animation:tin .22s ease;max-width:330px;
}
.toast svg{width:16px;height:16px;flex:none;}
@keyframes tin{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

.tip{position:relative;}
.tip::after{
  content:attr(data-tip);position:absolute;left:calc(100% + 10px);top:50%;
  transform:translateY(-50%);background:var(--ink);color:var(--ground);
  padding:4px 9px;border-radius:var(--r-sm);font-size:11.5px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .12s;z-index:70;
}
.app:not(.collapsed) .tip::after{display:none;}
.tip:hover::after{opacity:1;}

.mob-btn{display:none;}
@media (max-width:860px){
  :root{--rail:250px;}
  .mob-btn{display:grid;}
  .rail{position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%);transition:transform .2s;}
  .app.mob-open .rail{transform:translateX(0);}
  .app.collapsed .rail{width:var(--rail);}
  .page-title{display:none;}
  .hide-sm{display:none !important;}
  .content{padding:12px;}
  .bar-row{grid-template-columns:100px minmax(0,1fr) 42px;}
}
</style>

</div>

<aside class="drawer" id="drawer" aria-hidden="true"></aside>

const ST = {
  good:{l:'ใช้งาน',c:'good'}, info:{l:'ในคลัง',c:'info'}, warn:{l:'ซ่อมบำรุง',c:'warn'},
  crit:{l:'ชำรุด',c:'crit'}, mute:{l:'จำหน่ายแล้ว',c:'mute'}
};

function mkAssets(){
  const models = [
    ['Notebook','Lenovo ThinkPad E14','NB'],['Notebook','Dell Latitude 5440','NB'],
    ['Notebook','HP ProBook 450 G9','NB'],['Desktop','Dell OptiPlex 7010','PC'],
    ['Desktop','HP EliteDesk 800','PC'],['Monitor','Dell P2422H 24"','MN'],
    ['Printer','Canon iR-ADV C3826','PR'],['Switch','MikroTik CRS328-24P','SW'],
    ['Router','MikroTik RB5009UG','RT'],['Access Point','Ubiquiti U6-Pro','AP'],
    ['CCTV','Hikvision DS-2CD2143','CC'],['Server','Dell PowerEdge R650','SV'],
    ['UPS','APC Smart-UPS 3000VA','UP'],['Tablet','iPad 10th Gen','TB']
  ];
  const sts = ['good','good','good','good','good','good','info','info','warn','crit','mute'];
  const out=[];
  for(let i=0;i<26;i++){
    const m = models[i%models.length];
    const st = sts[(i*3)%sts.length];
    const loc = LOCS[i%LOCS.length];
    const yr = 2565 + (i%5);
    const owner = (st==='info'||st==='mute') ? '' : PEOPLE[i%PEOPLE.length];
    out.push({
      code:'TRR-'+m[2]+'-'+yr+'-'+String(101+i*7).padStart(4,'0'),
      name:m[1],
      type:m[0],
      status:st,
      owner:owner,
      dept: owner ? DEPTS[i%DEPTS.length] : '—',
      loc:loc,
      serial:(m[2]+'X'+(4820+i*137)).toUpperCase()+String.fromCharCode(65+(i%26)),
      ip: ['Switch','Router','Access Point','CCTV','Server','Printer'].includes(m[0])
          ? '10.'+(10+(i%4))+'.'+(1+(i%6))+'.'+(20+i) : (st==='good'?'10.20.'+(1+(i%5))+'.'+(101+i):''),
      buy:(yr-543)+'-'+String(1+(i%12)).padStart(2,'0')+'-'+String(1+(i%27)).padStart(2,'0'),
      age:(2569-yr)+ (i%2?0.5:0),
      /* ---- ฟิลด์สำหรับหน้ารายละเอียด ---- */
      d:{
        maker: m[1].startsWith('iPad') ? 'Apple' : m[1].split(' ')[0],   // ยี่ห้อดึงจากชื่อรุ่นให้ตรงกันเสมอ
        os:['Windows 11 Pro 23H2','Windows 10 Pro 22H2','macOS 14 Sonoma','RouterOS 7.14','—'][i%5],
        cpu:['Intel Core i7-1255U','Intel Core i5-12500','Apple M2','AMD Ryzen 5 5600','—'][i%5],
        ram:[8,16,16,32,4][i%5]+' GB',
        disk:['SSD 512 GB','SSD 256 GB','SSD 1 TB','HDD 1 TB','eMMC 64 GB'][i%5],
        mac:'B8:09:'+(10+i).toString(16).toUpperCase().padStart(2,'0')+':AB:C9:'+(20+i).toString(16).toUpperCase().padStart(2,'0'),
        host:m[1].split(' ')[0].toUpperCase()+'-'+(101+i*7),
        warranty:(2569-yr>3?'หมดประกันแล้ว':'ถึง '+(yr-543+3)+'-'+String(1+(i%12)).padStart(2,'0')+'-15'),
        wexp:(2569-yr>3),
        vendor:['บจก. ไอทีซัพพลาย','บมจ. ซินเน็ค','บจก. เจ.ไอ.บี.','บจก. แอดไวซ์'][i%4],
        po:'PO-'+yr+'-'+String(2100+i*13).padStart(4,'0'),
        price:(18500+i*2350).toLocaleString('th-TH'),
        book:(Math.max(0,18500+i*2350-(2569-yr)*4200)).toLocaleString('th-TH'),
        av:i%4===0?'ไม่พบ':'ESET Endpoint · เปิดใช้งาน',
        avOk:i%4!==0,
        fw:i%5===0?'ปิดใช้งาน':'เปิดใช้งาน',
        fwOk:i%5!==0,
        online:i%3!==0,
        agent:'3.7.'+(1+i%4),
        seen:(i%3!==0)?'เมื่อ '+(1+i%50)+' นาทีที่แล้ว':(1+i%12)+' วันที่แล้ว'
      }
    });
  }
  return out;
}

const $ = s=>document.querySelector(s);

/* M() = โมดูลที่กำลังเปิดอยู่ "รวมกับ" ข้อมูลของแท็บที่เลือก
   แท็บกำหนด cols/rows ของตัวเองได้ หรือใช้ filter คัดจากข้อมูลกลางก็ได้ */
function M(){
  const m = DB[S.mod], t = (m.tabs && m.tabs[S.tab]) || {};
  return { ...m, cols: t.cols || m.cols, rows: t.rows || m.rows, _filter: t.cols ? null : t.filter };
}
const esc = s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initials = n=>{const p=String(n||'').trim().split(/\s+/);return ((p[0]||'?')[0]+(p[1]||'')[0]||'').toUpperCase();};

function toast(msg,icon){
  const el=document.createElement('div');
  el.className='toast';
  el.innerHTML=ic(icon||'check')+'<span>'+esc(msg)+'</span>';
  $('#toasts').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .25s';setTimeout(()=>el.remove(),250);},2600);
}

/* ค้นหาแบบข้ามทุกคอลัมน์ + ฟิลเตอร์รายคอลัมน์ + เรียงลำดับ */
function cellText(row,col){
  const v=row[col.k];
  if(col.ty==='path' && Array.isArray(v)) return v.join(' ');
  if(col.ty==='pill') return (ST[v]||{l:v}).l;
  return String(v??'');
}
function processed(){
  const m=M(); if(!m.cols) return [];
  let rows=m.rows.slice();
  if(m._filter) rows=rows.filter(m._filter);
  if(S.q.trim()){
    const q=S.q.toLowerCase();
    rows=rows.filter(r=>m.cols.some(c=>cellText(r,c).toLowerCase().includes(q)));
  }
  for(const key in S.colq){
    const v=(S.colq[key]||'').toLowerCase(); if(!v) continue;
    const col=m.cols.find(c=>c.k===key); if(!col) continue;
    rows=rows.filter(r=>cellText(r,col).toLowerCase().includes(v));
  }
  if(S.sort.k){
    const col=m.cols.find(c=>c.k===S.sort.k);
    rows.sort((a,b)=>{
      let A=cellText(a,col), B=cellText(b,col);
      if(col.ty==='num'){A=parseFloat(String(a[col.k]).replace(/,/g,''))||0;B=parseFloat(String(b[col.k]).replace(/,/g,''))||0;}
      return (A<B?-1:A>B?1:0)*S.sort.dir;
    });
  }
  return rows;
}

function renderNav(){
  let h='', lastSec=null;
  for(const key in DB){
    const m=DB[key];
    if(m.sec && m.sec!==lastSec){ h+='<div class="rail-sec">'+esc(m.sec)+'</div>'; lastSec=m.sec; }
    h+='<button class="nav-i tip'+(S.mod===key?' on':'')+'" data-tip="'+esc(m.label)+'" onclick="go(\''+key+'\')">'
      + ic(m.icon) + '<span>'+esc(m.label)+'</span>'
      + (m.badge?'<span class="nav-badge">'+m.badge+'</span>':'') + '</button>';
  }
  $('#nav').innerHTML=h;
}

  $('#newBtn').innerHTML = ic('plus') + '<span>' + esc(m.newLabel || 'สร้างใหม่') + '</span>';
  $('#newBtn').style.display = (m.kind==='explorer' && m.newLabel) ? '' : 'none';

  // ในหน้ารายละเอียด: ซ่อนแถบเครื่องมือของ Explorer ทั้งหมด (หน้านั้นมีแท็บของตัวเอง)
  if(S.detail){ $('#subtabs').style.display='none'; $('#toolbar').style.display='none'; $('#newBtn').style.display='none'; return; }

  // Sub tabs
  if(m.tabs && m.tabs.length>1){
    $('#subtabs').style.display='flex';
    $('#subtabs').innerHTML=m.tabs.map((t,i)=>

      + (t.ic?ic(t.ic):'') + '<span>'+esc(t.t)+'</span></button>').join('');

  // Toolbar
  if(m.kind!=='explorer'){ $('#toolbar').style.display='none'; return; }
  $('#toolbar').style.display='flex';
  const activeFilters=Object.values(S.colq).filter(Boolean).length;
  $('#toolbar').innerHTML =
    '<button class="chip on">'+ic('save')+'<span>'+esc(m.views[0])+'</span></button>'

    + '<div class="tb-div"></div>'
    + '<button class="chip'+(activeFilters?' on':'')+'" onclick="clearFilters()">'+ic('filter')
      +'<span>'+(activeFilters?('ล้างตัวกรอง '+activeFilters):'ตัวกรอง')+'</span></button>'

    + '<div class="spacer"></div>'
    + '<button class="icon-btn hide-sm" onclick="refresh()" aria-label="โหลดใหม่">'+ic('refresh')+'</button>'
    + '<button class="icon-btn'+(S.view==='table'?' on':'')+'" onclick="setView(\'table\')" aria-label="มุมมองตาราง">'+ic('tablev')+'</button>'

    + '<button class="icon-btn hide-sm'+(S.side?' on':'')+'" onclick="toggleSide()" aria-label="แผงสรุปสถิติ">'+ic('panel')+'</button>'
    + '<button class="icon-btn menu-trigger hide-sm'+(S.menu?' on':'')+'" onclick="toggleMenu()" aria-label="ตัวเลือก">'+ic('more',2.4)+'</button>';

  switch(col.ty){
    case 'mono':  return v?'<span class="mono">'+esc(v)+'</span>':'<span style="color:var(--ink-3)">—</span>';
    case 'link':  return '<span class="cell-link">'+esc(v)+'</span>';
    case 'tag':   return v?'<span class="tag">'+esc(v)+'</span>':'—';
    case 'num':   return '<span class="mono num">'+esc(v)+'</span>';
    case 'pill': {
      const s=ST[v]||{l:v,c:'mute'};
      return '<span class="pill '+s.c+'"><span class="dot"></span>'+esc(s.l)+'</span>';
    }
    case 'path':  return Array.isArray(v)
      ? '<span class="path">'+v.map(esc).join('<i>›</i>')+'</span>' : esc(v);
    case 'person':
      if(!v||v==='—') return '<span style="color:var(--ink-3)">ไม่ระบุ</span>';
      return '<span class="person"><span class="ini">'+esc(initials(v))+'</span>'+esc(v)+'</span>';
    default: return esc(v);
  }
}

/* ============================================================
   8) RENDER — CONTENT
   ============================================================ */
function render(){
  renderNav(); renderChrome();
  const m=M(), c=$('#content');

  if(S.detail){ c.className='content flush'; c.innerHTML=detailHTML(); animateBars(); return; }
  if(m.kind==='dashboard'){ c.className='content'; c.innerHTML=dashboardHTML(); animateBars(); return; }
  if(m.kind==='settings'){ c.className='content'; c.innerHTML=settingsHTML(m); return; }
  if(m.kind==='stub'){ c.className='content'; c.innerHTML=stubHTML(m); return; }

  c.className='content flush';
  const rows=processed();
  const pages=Math.max(1,Math.ceil(rows.length/S.per));
  if(S.page>pages) S.page=pages;
  const slice=rows.slice((S.page-1)*S.per, S.page*S.per);

  c.innerHTML =
    '<div class="withside">'
      + (S.view==='table' ? tableHTML(m,slice) : cardsHTML(m,slice))
      + (S.side ? sideHTML(m,rows) : '')
    + '</div>'
    + footHTML(rows.length,pages)
    + (S.menu ? menuHTML() : '')
    + (S.rowMenu ? rowMenuHTML() : '')
    + (S.sel.size ? bulkHTML() : '');
  animateBars();
}

/* ---------- แผงสรุปสถิติด้านขวา (อ้างอิงจากผลลัพธ์ที่กรองอยู่จริง) ---------- */
function sideHTML(m,rows){
  const dimCol = m.cols.find(c=>c.k===S.sideDim) || m.cols.find(c=>c.ty==='pill') || m.cols[2];
  /* ถ้ามีการเลือกแถวอยู่ ให้สรุปเฉพาะแถวที่เลือก (พฤติกรรมเดียวกับ InvGate) */
  const key=m.cols[0].k;
  const scoped = S.sel.size ? rows.filter(r=>S.sel.has(r[key])) : rows;
  const selMode = S.sel.size>0;
  rows = scoped;
  const tally={};
  rows.forEach(r=>{ const k=cellText(r,dimCol)||'ไม่ระบุ'; tally[k]=(tally[k]||0)+1; });
  const top=Object.entries(tally).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const max=Math.max(1,...top.map(t=>t[1]));

  // มูลค่ารวม — คิดเฉพาะโมดูลที่มีราคา
  let money='';
  if(S.mod==='assets'){
    const sum=rows.reduce((a,r)=>a+parseInt(String(r.d?.price||'0').replace(/,/g,''),10),0);
    money='<div class="side-stat"><span>มูลค่าตามราคาซื้อ</span><b class="money">฿'+sum.toLocaleString('th-TH')+'</b></div>';
  }
  const opts=m.cols.filter(c=>['pill','tag','path','person'].includes(c.ty)||c.k==='dept')
    .map(c=>'<option value="'+c.k+'"'+(c.k===dimCol.k?' selected':'')+'>'+esc(c.t)+'</option>').join('');

  return '<aside class="side">'
    + '<div class="side-stat"><span>'+(selMode?'รายการที่เลือกอยู่':'ผลลัพธ์ที่แสดงอยู่')+'</span>'
      + '<b'+(selMode?' style="color:var(--accent)"':'')+'>'+rows.length.toLocaleString('th-TH')+'</b></div>'
    + money
    + '<div><h4 style="margin-bottom:9px">สรุปตามมิติ</h4>'
      + '<select class="side-sel" onchange="setDim(this.value)">'+opts+'</select></div>'
    + '<div class="bars">'
      + top.map(t=>'<div class="bar-row" style="grid-template-columns:1fr" title="'+esc(t[0])+': '+t[1]+'">'
          + '<div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:4px">'
            + '<span class="bar-lb">'+esc(t[0])+'</span>'
            + '<span class="bar-vl">'+t[1]+'</span></div>'
          + '<span class="bar-tr"><span class="bar-fl" data-w="'+(t[1]/max*100)+'" style="width:0"></span></span>'
          + '</div>').join('')
    + '</div></aside>';
}

/* Donut แบบ path arc — เว้นช่อง 2px ระหว่างชิ้นตามหลัก data-viz */
function donutSVG(data,total){
  const cx=85,cy=85,r=62,w=20, gap=0.035;
  let a0=0, out='';
  data.forEach(d=>{
    if(!d.v) return;
    const frac=d.v/total;
    const a1=a0+frac*Math.PI*2;
    const s=a0+gap/2, e=Math.max(s+0.001,a1-gap/2);
    const large=(e-s)>Math.PI?1:0;
    const ro=r+w/2, ri=r-w/2;
    const x1=cx+ro*Math.cos(s),y1=cy+ro*Math.sin(s);
    const x2=cx+ro*Math.cos(e),y2=cy+ro*Math.sin(e);
    const x3=cx+ri*Math.cos(e),y3=cy+ri*Math.sin(e);
    const x4=cx+ri*Math.cos(s),y4=cy+ri*Math.sin(s);
    out+='<path d="M'+x1+' '+y1+' A'+ro+' '+ro+' 0 '+large+' 1 '+x2+' '+y2
       + ' L'+x3+' '+y3+' A'+ri+' '+ri+' 0 '+large+' 0 '+x4+' '+y4+' Z" fill="'+d.color+'">'
       + '<title>'+esc(d.label)+': '+d.v+' รายการ ('+Math.round(frac*100)+'%)</title></path>';
    a0=a1;
  });
  return '<svg width="170" height="170" viewBox="0 0 170 170" role="img" aria-label="สัดส่วนสถานะอุปกรณ์">'+out+'</svg>';
}

function openDrawer(id){
  const m=M(); if(!m.cols) return;
  const key=m.cols[0].k;

  if(!row) return;
  const st=m.cols.find(c=>c.ty==='pill');
  $('#drawer').innerHTML =
    '<div class="dw-h"><div style="flex:1;min-width:0">'
      + '<h2>'+esc(row[m.cols[1].k])+'</h2>'
      + '<span class="mono">'+esc(row[key])+'</span></div>'
      + (st?cell(row,st):'')
      + '<button class="icon-btn" onclick="closeDrawer()" aria-label="ปิด">'+ic('x')+'</button></div>'
    + '<div class="dw-tabs">'
      + '<button class="subtab on">รายละเอียด</button>'
      + '<button class="subtab" onclick="toast(\'แท็บประวัติยังไม่ได้เชื่อมข้อมูล\')">ประวัติ</button>'
      + '<button class="subtab" onclick="toast(\'แท็บเอกสารแนบยังไม่ได้เชื่อมข้อมูล\')">เอกสารแนบ</button></div>'
    + '<div class="dw-b"><dl class="dl">'
      + m.cols.map(c=>'<div class="dl-r"><dt>'+esc(c.t)+'</dt><dd>'+cell(row,c)+'</dd></div>').join('')
      + '</dl></div>'
    + '<div class="dw-f">'
      + '<button class="btn btn-primary" onclick="openDetail(\''+String(row[key]).replace(/'/g,'')+'\')">'+ic('expand')+'เปิดหน้าเต็ม</button>'
      + '<button class="btn btn-ghost" onclick="toast(\'สร้างใบส่งมอบจากรายการนี้\')">'+ic('swap')+'ส่งมอบ</button>'
      + '<div class="spacer"></div>'
      + '<button class="icon-btn" onclick="toast(\'ยังไม่ได้เชื่อมการลบ\')" aria-label="ลบ">'+ic('trash')+'</button></div>';
  $('#drawer').classList.add('on'); $('#drawer').setAttribute('aria-hidden','false');
  $('#scrim').classList.add('on');
}
function closeDrawer(){
  $('#drawer').classList.remove('on'); $('#drawer').setAttribute('aria-hidden','true');

function selAll(on){

/* ส่งออก CSV — ทำงานเมื่อเปิดไฟล์บนเครื่อง (หน้าพรีวิวบล็อกการดาวน์โหลด) */
function exportCSV(){
  const m=M();
  const rows=processed();
  const head=m.cols.map(c=>c.t).join(',');
  const body=rows.map(r=>m.cols.map(c=>'"'+cellText(r,c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob(['﻿'+head+'\n'+body],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=S.mod+'-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  toast('ส่งออก '+rows.length+' รายการเป็น CSV','down');
}

function toggleRail(){ S.collapsed=!S.collapsed; syncApp(); }
function toggleMobNav(){ S.mobOpen=!S.mobOpen; syncApp(); }
function syncApp(){
  const a=$('#app');
  a.classList.toggle('collapsed',S.collapsed);
  a.classList.toggle('mob-open',S.mobOpen);
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const sysDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
  const next=(cur ? cur==='dark' : sysDark) ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme',next);
  try{ localStorage.setItem('trr-theme',next); }catch(e){}
  syncTheme(); render();
}
function syncTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur==='dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  $('#themeIcon').innerHTML = ic(dark?'sun':'moon');
  $('#themeLabel').textContent = dark?'โหมดสว่าง':'โหมดมืด';
}

/* ============================================================
   12) INIT
   ============================================================ */
(function init(){
  try{ const t=localStorage.getItem('trr-theme'); if(t) document.documentElement.setAttribute('data-theme',t); }catch(e){}
  $('#mobBtn').innerHTML=ic('menu');
  $('#railBtn').innerHTML=ic('chevLL');
  $('#searchIcon').innerHTML=ic('search');
  $('#bellBtn').innerHTML=ic('bell');
  syncTheme(); syncApp(); render();
  document.addEventListener('keydown',e=>{
    if(e.key!=='Escape') return;
    if($('#drawer').classList.contains('on')) closeDrawer();
    else if(S.rowMenu) closeRowMenu();
    else if(S.menu) closeMenu();
    else if(S.detail) closeDetail();
  });
  /* คลิกที่อื่นเพื่อปิดเมนูที่เปิดค้างอยู่ */
  document.addEventListener('click',e=>{
    if(!S.rowMenu && !S.menu) return;
    if(e.target.closest('.rmenu,.menu,.menu-trigger')) return;
    S.rowMenu=null; S.menu=false; render();
  },true);
})();
