services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: assethub
      POSTGRES_PASSWORD: assethub123
      POSTGRES_DB: assethub
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assethub"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql://assethub:assethub123@postgres:5432/assethub?schema=public"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_node:/app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_BORROW_DUE_DAYS: "3"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node:/app/node_modules

volumes:
  pgdata:
  backend_node:
    external: true
  frontend_node:
    external: true
